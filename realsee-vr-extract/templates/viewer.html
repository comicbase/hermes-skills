<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>360° 全景查看器</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:#111; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  #c { display:block; width:100%; height:100%; cursor:grab; }
  #c:active { cursor:grabbing; }
  #bar { position:fixed; top:0; left:0; right:0; z-index:10; display:flex; align-items:center;
    gap:10px; padding:10px 14px; background:linear-gradient(180deg,rgba(0,0,0,.72),rgba(0,0,0,0));
    color:#fff; font-size:14px; }
  #bar select { padding:6px 10px; border-radius:8px; border:1px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.12); color:#fff; font-size:14px; max-width:320px; }
  #bar select option { color:#000; }
  #bar button { padding:6px 14px; border-radius:8px; border:none; cursor:pointer;
    background:rgba(255,255,255,.18); color:#fff; font-size:15px; }
  #bar button:hover { background:rgba(255,255,255,.32); }
  #label { font-weight:600; white-space:nowrap; }
  #hint { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:10;
    color:rgba(255,255,255,.75); font-size:13px; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar">
  <span id="label">观察点</span>
  <select id="sel"></select>
  <button id="prev" title="上一张">‹</button>
  <button id="next" title="下一张">›</button>
  <span id="pos"></span>
</div>
<div id="hint">拖拽旋转 360° · 滚轮缩放</div>
<script src="three.min.js"></script>
<script>
// Replace `scenes` with your files, or generate programmatically as below.
const scenes = []; // {name: '...', file: 'pano00_floor1_360.jpg'}
// Example generator for realsee output panoNN_floorF_360.jpg:
// for (let i = 0; i < SCENE_COUNT; i++) {  // SCENE_COUNT = panorama.count, varies per listing
//   const floor = i < 15 ? 1 : 2;
//   scenes.push({ name:'观察点'+String(i).padStart(2,'0')+' · 第'+floor+'层',
//                 file:'pano'+String(i).padStart(2,'0')+'_floor'+floor+'_360.jpg' });
// }

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,0,0);
camera.rotation.order = 'YXZ';

const geo = new THREE.SphereGeometry(500, 64, 64);
const mat = new THREE.MeshBasicMaterial({ side: THREE.BackSide });
scene.add(new THREE.Mesh(geo, mat));

const loader = new THREE.TextureLoader();

let lon = 0, lat = 0, fov = 75, dragging = false, px = 0, py = 0;

function load(i) {
  loader.load(encodeURI(scenes[i].file), tex => { mat.map = tex; mat.needsUpdate = true; });
  document.getElementById('label').textContent = scenes[i].name;
  document.getElementById('sel').value = String(i);
  document.getElementById('pos').textContent = (i+1) + ' / ' + scenes.length;
}

canvas.addEventListener('mousedown', e => { dragging = true; px = e.clientX; py = e.clientY; });
window.addEventListener('mouseup', () => dragging = false);
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  lon += (e.clientX - px) * 0.12;   // "+" = grab-the-scene (drag right -> look left)
  lat += (e.clientY - py) * 0.12;
  lat = Math.max(-88, Math.min(88, lat));
  px = e.clientX; py = e.clientY;
});
canvas.addEventListener('touchstart', e => { dragging = true; px = e.touches[0].clientX; py = e.touches[0].clientY; });
window.addEventListener('touchend', () => dragging = false);
window.addEventListener('touchmove', e => {
  if (!dragging) return;
  lon += (e.touches[0].clientX - px) * 0.12;
  lat += (e.touches[0].clientY - py) * 0.12;
  lat = Math.max(-88, Math.min(88, lat));
  px = e.touches[0].clientX; py = e.touches[0].clientY;
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  fov = Math.max(30, Math.min(110, fov + e.deltaY * 0.03));
}, { passive: false });

const sel = document.getElementById('sel');
scenes.forEach((s, i) => {
  const o = document.createElement('option'); o.value = String(i); o.textContent = s.name;
  sel.appendChild(o);
});
sel.addEventListener('change', () => load(parseInt(sel.value)));
document.getElementById('prev').addEventListener('click', () => load((parseInt(sel.value)+scenes.length-1)%scenes.length));
document.getElementById('next').addEventListener('click', () => load((parseInt(sel.value)+1)%scenes.length));

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  camera.rotation.y = THREE.MathUtils.degToRad(lon);
  camera.rotation.x = THREE.MathUtils.degToRad(lat);
  if (Math.abs(camera.fov - fov) > 0.1) { camera.fov = fov; camera.updateProjectionMatrix(); }
  renderer.render(scene, camera);
}

load(0);
animate();
</script>
</body>
</html>
